# 本地开发依赖。账号口令只用于本机，不要拿到生产环境复用。
name: tishuashua

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tishuashua
      POSTGRES_PASSWORD: tishuashua
      POSTGRES_DB: tishuashua
    ports:
      - '5432:5432'
    volumes:
      - tishuashua_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tishuashua -d tishuashua']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - tishuashua_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tishuashua_pg:
  tishuashua_redis:
